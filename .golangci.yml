version: "2"

linters:
  enable:
    - revive
    - gosec
    - gocritic
    - godot
    - err113
  settings:
    gosec:
      excludes:
        - G306 # WriteFile with 0644 is intentional for web content files readable by all
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - err113
      # Tests use temp dirs and fixed paths; gosec file/dir/exec rules are noise there.
      - path: _test\.go
        linters:
          - gosec
